name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2  # needed to inspect HEAD's parent in the guard below
          token: ${{ secrets.GITHUB_TOKEN }}

      # The workflow bumps versions on main and moves the tag to that commit.
      # Refuse to run if main has moved past the tagged commit, otherwise the
      # release would silently include commits that were not part of the tag.
      # Exception: on a re-run after a partial failure, main may already hold
      # this workflow's own version-bump commit on top of the tagged commit.
      - name: Ensure tag points at main HEAD
        run: |
          MAIN_SHA=$(git rev-parse HEAD)
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          PARENT_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          SUBJECT=$(git log -1 --format=%s HEAD)
          AUTHOR=$(git log -1 --format=%an HEAD)
          EXPECTED="chore: bump version to ${GITHUB_REF_NAME#v} [skip ci]"
          if [ "$PARENT_SHA" = "$GITHUB_SHA" ] && [ "$SUBJECT" = "$EXPECTED" ] && [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "main HEAD is this release's own version-bump commit on top of the tag; continuing (re-run)."
            exit 0
          fi
          echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not main HEAD ($MAIN_SHA). Re-tag the current main HEAD and push again."
          exit 1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in all files
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # vshot script
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" vshot

          # plugin.json
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

          # marketplace.json (metadata.version + plugins[0].version)
          jq --arg v "$VERSION" '.metadata.version = $v | .plugins[0].version = $v' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vshot .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push origin main

      - name: Move tag to version-bumped commit
        run: |
          git tag -f "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "vshot v${VERSION}" \
            --generate-notes \
            --latest
