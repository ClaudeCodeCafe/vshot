name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck vshot
          shellcheck -S warning tests/smoke.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Run smoke tests
        run: bash tests/smoke.sh

  # vshot targets macOS's stock bash 3.2 — run the smoke tests there too
  smoke-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ffmpeg imagemagick
      - name: Show bash version
        run: /bin/bash --version | head -1
      - name: Run smoke tests with /bin/bash (3.2)
        run: /bin/bash tests/smoke.sh
      - name: Debug scene mode (temporary)
        if: failure()
        run: |
          ffmpeg -version | head -1
          ffmpeg -v error -f lavfi -i "color=c=red:s=320x180:d=2[r];color=c=blue:s=320x180:d=2[b];[r][b]concat=n=2:v=1:a=0" -c:v libx264 -t 4 -y /tmp/s.mp4; echo "gen exit=$?"; ls -la /tmp/s.mp4
          /bin/bash -x ./vshot /tmp/s.mp4 --scene --output /tmp/so 2>&1 | tail -40
