name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck vshot
          shellcheck -S warning tests/smoke.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Run smoke tests
        run: bash tests/smoke.sh

  # vshot targets macOS's stock bash 3.2 — run the smoke tests there too
  smoke-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ffmpeg imagemagick
      - name: Show bash version
        run: /bin/bash --version | head -1
      - name: Run smoke tests with /bin/bash (3.2)
        run: /bin/bash tests/smoke.sh
